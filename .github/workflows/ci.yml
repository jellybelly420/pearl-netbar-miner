name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/pearl-control ./cmd/pearl-control
      - run: GOOS=windows GOARCH=amd64 go build -o bin/pearl-agent.exe ./cmd/pearl-agent
      - run: GOOS=windows GOARCH=amd64 go build -o bin/pearl-manifest.exe ./cmd/pearl-manifest

